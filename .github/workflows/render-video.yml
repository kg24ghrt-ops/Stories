name: Assemble Final Video

on:
  workflow_dispatch:
  push:
    paths:
      - 'animation/scenes/**'
      - 'animation/assemble.py'
      - '.github/workflows/render-video.yml'

permissions:
  contents: read

concurrency:
  group: assemble-final-video
  cancel-in-progress: false

jobs:
  assemble:
    name: Assemble existing scene clips
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Show runner environment
        run: |
          echo "Runner OS: $RUNNER_OS"
          echo "Runner architecture: $RUNNER_ARCH"
          uname -a
          df -h "$GITHUB_WORKSPACE"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Assemble existing scene clips
        working-directory: animation
        run: |
          python assemble.py

      - name: Verify final video
        run: |
          test -s one_school_one_day_final.mp4

          echo "Final video:"
          ls -lh one_school_one_day_final.mp4

          echo "Media information:"
          ffprobe -v error \
            -show_entries format=duration,size:stream=codec_type,codec_name,width,height,r_frame_rate \
            -of json \
            one_school_one_day_final.mp4

          python - <<'PY'
          import os

          path = "one_school_one_day_final.mp4"
          size = os.path.getsize(path)

          if size < 1024 * 1024:
              raise SystemExit(
                  f"Final video is suspiciously small: {size} bytes"
              )

          print(f"Final video size: {size:,} bytes")
          PY

      - name: Upload final video
        uses: actions/upload-artifact@v7
        with:
          name: one-school-one-day-final-video
          path: one_school_one_day_final.mp4
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
